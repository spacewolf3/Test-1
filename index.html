  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="topbar">
    <nav class="topnav">
      <a href="#/paper" data-view="paper">📰 The Paper</a>

      <a href="#/settings" data-view="settings" class="right" aria-label="Settings">⚙<span class="nav-label"> Settings</span></a>
    </nav>

  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/format.js"></script>
  <script src="js/evergreen.js"></script>
  <script src="js/feeds.js"></script>
  <script src="js/sources.js"></script>
  <script src="js/books.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Home-screen app support: works offline, and asks the browser not to clear saved articles.
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  </script>
</body>
